# Operator-owned allowlist. A repo absent here (or enabled:false) is rejected at
# the webhook stage. This file is NEVER read from a target repo.
repos:
  - full_name: "your-github-owner/your-repo"
    enabled: true
    default_branch: "main"
    assignee_login: "your-github-login"
    # Optional friendly names accepted by POST /api/runs `repo` and surfaced by
    # GET /api/repos (matched case/whitespace-insensitively). Defaults to none.
    aliases: ["My Repo"]
    # Optional: merge | squash | rebase. Defaults to squash.
    merge_method: "squash"
    poll: false
