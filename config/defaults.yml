# Global defaults. Per-repo overrides live in repos.yml.
# auto_merge / auto_deploy are INVARIANTS — not overridable anywhere (see SPEC §14).
concurrency:
  max_global_workers: 2
  max_workers_per_repo: 2

timeouts:
  task_wall_clock_sec: 1800 # hard kill of a codex-runner container
  awaiting_approval_ttl_sec: 172800 # 48h, then auto-cancel the HITL + task
  repo_lock_buffer_sec: 120 # lock TTL = wall_clock + buffer

garbage_collection:
  enabled: true
  # Deletes only finished, non-latest run dirs and matching disposable worktrees.
  # Task dirs, git mirrors, latest run dirs, and active task runs are retained.
  run_retention_sec: 604800 # 7 days
  sweep_interval_sec: 3600 # 1 hour
  max_retained_run_bytes: 10737418240 # 10 GiB across retainable non-latest runs

container:
  cpus: 2
  memory: "4g"
  image: "codex-runner:latest"
  # Egress-only network for the runner. "bridge" = unrestricted egress, no creds
  # mounted (MVP default). Swap for a locked-down network in M5 (SPEC §14).
  # Ignored when dev_containers is true (each run gets a private network instead).
  network: "bridge"
  # Per-run docker:dind sidecar so Codex can create dev/test containers; all
  # nested containers are destroyed when the run ends (SPEC §9.1).
  dev_containers: true
  dind_image: "docker:27-dind"

codex:
  sandbox: "workspace-write"
  approval_policy: "never" # -c approval_policy=<value>; never = run in-sandbox, no prompts
  auth_refresh_skew_sec: 600 # refresh token if it expires within 10 min
  # -c model_reasoning_effort=<value>: minimal | low | medium | high | xhigh (needs a
  # reasoning model). Comment out to use the model/config.toml default.
  reasoning_effort: "high"

policy:
  auto_merge: false # INVARIANT
  auto_deploy: false # INVARIANT
