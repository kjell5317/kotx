name: build-images

# Builds and pushes the two images to GHCR:
#   ghcr.io/<owner>/kotx-app     (app + worker; root Dockerfile)
#   ghcr.io/<owner>/kotx-runner  (the short-lived codex-runner)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Pin the Codex CLI baked into the runner image to match your host CLI.
  # 0.144.5+ is required for the gpt-5.6-sol model (older CLIs are rejected by
  # the backend with "requires a newer version of Codex").
  CODEX_VERSION: "0.144.5"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: kotx-app
            context: .
          - name: kotx-runner
            context: ./runner
    steps:
      - uses: actions/checkout@v4

      # GHCR image paths must be lowercase; the org/user login may not be.
      - id: prep
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # only the runner image consumes CODEX_VERSION; harmless for the app
          build-args: ${{ matrix.name == 'kotx-runner' && format('CODEX_VERSION={0}', env.CODEX_VERSION) || '' }}
