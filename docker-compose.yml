services:
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # one-shot: applies pending DB migrations, then exits. app/worker wait for it.
  migrate:
    image: ${KOTX_IMAGE:?Set KOTX_IMAGE to your published kotx-app image}
    # --no-single-transaction: each migration commits on its own, so a migration
    # that ADDs an enum value can be followed by one that USES it (Postgres
    # forbids both in one transaction).
    command:
      [
        "node_modules/.bin/node-pg-migrate",
        "up",
        "-m",
        "migrations",
        "-j",
        "sql",
        "--no-single-transaction",
      ]
    env_file: .env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    image: ${KOTX_IMAGE:?Set KOTX_IMAGE to your published kotx-app image}
    restart: unless-stopped
    command: ["node", "packages/app/dist/index.js"]
    env_file: .env
    environment:
      CONFIG_DIR: /app/config
      PROMPTS_DIR: /app/prompts
    volumes:
      # mount config/prompts from the repo so edits don't need an image rebuild
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro
      # the API serves TASK.md/REVIEW.md and edits the brief (PUT) → needs rw
      - ${AGENT_DATA_DIR:-/srv/agent}:${AGENT_DATA_DIR:-/srv/agent}
      # read-only docker access so GET /api/containers can `docker ps` the runners
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  worker:
    image: ${KOTX_IMAGE:?Set KOTX_IMAGE to your published kotx-app image}
    restart: unless-stopped
    command: ["node", "packages/worker/dist/index.js"]
    env_file: .env
    environment:
      CONFIG_DIR: /app/config
      PROMPTS_DIR: /app/prompts
    volumes:
      # the worker drives Docker directly (dockerode) — socket mounted HERE ONLY,
      # never into a codex-runner container (SPEC §14).
      - /var/run/docker.sock:/var/run/docker.sock
      # host data dirs must be visible at identical paths so bind mounts the
      # worker hands to codex-runner resolve on the host daemon.
      - ${AGENT_DATA_DIR:-/srv/agent}:${AGENT_DATA_DIR:-/srv/agent}
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kotx
      # Local default only. Change this and DATABASE_URL before any exposed use.
      POSTGRES_PASSWORD: kotx
      POSTGRES_DB: kotx
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kotx"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  redis_data:
